name: Sınama
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sinama:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Eylemler sürüm etiketiyle değil commit'iyle çağrılır: Etiket başka bir commit'e taşınsa da aynı kod çalışır.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - run: node araclar/paketle.mjs
